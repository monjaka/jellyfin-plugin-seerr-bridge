name: build

# Builds every branch push and pull request. Version tags are handled by
# release.yml, so they're left out here to avoid building the same thing twice.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  FRAMEWORK: net10.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Read plugin version
        run: echo "PLUGIN_VERSION=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)" >> "$GITHUB_ENV"

      - run: dotnet restore
      - run: dotnet build -c Release --no-restore

      - name: Package plugin
        run: |
          mkdir -p "dist/JellyseerrBridge_${PLUGIN_VERSION}"
          cp -a "src/Jellyfin.Plugin.JellyseerrBridge/bin/Release/${FRAMEWORK}/." "dist/JellyseerrBridge_${PLUGIN_VERSION}/"
          cd dist
          zip -r "JellyseerrBridge_${PLUGIN_VERSION}.zip" "JellyseerrBridge_${PLUGIN_VERSION}"
          md5sum "JellyseerrBridge_${PLUGIN_VERSION}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: JellyseerrBridge_${{ env.PLUGIN_VERSION }}
          path: dist/JellyseerrBridge_${{ env.PLUGIN_VERSION }}.zip
